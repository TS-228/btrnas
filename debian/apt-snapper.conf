# Create snapper pre/post snapshots around apt package changes when
# the root filesystem is btrfs and snapper config "root" exists.
# Requires: snapper create-config /  (done in nasty.postinst when possible)

DPkg::Pre-Invoke { "/usr/share/nasty/apt-snapper.sh pre || true"; };
DPkg::Post-Invoke { "/usr/share/nasty/apt-snapper.sh post || true"; };
